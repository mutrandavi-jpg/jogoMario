<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/script.js" defer></script>
    <title>Mario Jump</title>
</head>
<body>

    <div class="game-board">
       <div class="score">Pontos: <span id="score-value">0</span></div>

       <img src="./images/clouds.png" class="clouds">
       <img src="./images/bowser.gif" class="bowser">
       <img src="./images/mario.gif" class="mario">

       <div class="game-over-screen" id="game-over-screen">
           <img src="./images/will.jpg" alt="Game Over">
           <h1>GAME OVER</h1>
           <p>Pontuação final: <span id="final-score">0</span></p>
       </div>
    </div>

</body>
</html>
